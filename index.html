<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KITABQUEST – Pengembaraan 4 Kitab Allah (Pendidikan Islam Tahun 3)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Palet Warna Kawaii Pastel Aesthetic */
      --kawaii-pink: #F8C8DC;
      --kawaii-pink-soft: #FCE4EC;
      --kawaii-pink-deep: #E07A9F;
      --kawaii-mint: #C8E6C9;
      --kawaii-mint-deep: #3B8C5E;
      --kawaii-blue: #D6EAF8;
      --kawaii-blue-deep: #3B7CA8;
      --kawaii-cream: #FFF8E7;
      --kawaii-yellow: #FFF0B3;
      --kawaii-yellow-deep: #9A7410;
      --kawaii-brown: #594A4E;
      --kawaii-brown-soft: #756368;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      line-height: 1.65;
      background-color: var(--kawaii-cream);
      color: var(--kawaii-brown);
      overflow-x: hidden;
      /* Corak Geometri Islam Halus + Awan Pastel Lembut */
      background-image:
        radial-gradient(circle at 12% 14%, rgba(248, 200, 220, 0.55) 0%, transparent 36%),
        radial-gradient(circle at 88% 16%, rgba(214, 234, 248, 0.55) 0%, transparent 38%),
        radial-gradient(circle at 84% 86%, rgba(200, 230, 201, 0.55) 0%, transparent 38%),
        radial-gradient(circle at 15% 88%, rgba(255, 240, 179, 0.55) 0%, transparent 36%),
        radial-gradient(rgba(224, 122, 159, 0.14) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 28px 28px;
      background-attachment: fixed;
    }

    h1, h2, h3, h4, .font-display {
      font-family: 'Fredoka', sans-serif;
      color: var(--kawaii-brown);
      letter-spacing: -0.01em;
    }

    .font-arabic {
      font-family: 'Amiri', serif;
      line-height: 2.2;
      color: var(--kawaii-brown);
    }

    /* Kawaii Pastel Rounded Cards */
    .card-3d {
      background: #FFFFFF;
      border-radius: 2rem;
      border: 3px solid #F8C8DC;
      box-shadow:
        0 8px 0 rgba(248, 200, 220, 0.65),
        0 16px 28px -10px rgba(89, 74, 78, 0.12),
        inset 0 4px 10px rgba(255, 248, 231, 0.9);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }

    .card-3d-hover:hover {
      transform: translateY(-4px);
      box-shadow:
        0 12px 0 rgba(224, 122, 159, 0.45),
        0 20px 32px -10px rgba(89, 74, 78, 0.15);
    }

    /* Kawaii Pastel Cute Buttons */
    .btn-3d {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      border-radius: 1.5rem;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .btn-3d:active {
      transform: translateY(3px) !important;
      box-shadow: 0 2px 0 rgba(89, 74, 78, 0.2) !important;
    }

    .btn-pink {
      background: linear-gradient(180deg, #F8C8DC 0%, #F2A6C4 100%);
      color: var(--kawaii-brown);
      border: 2px solid #E07A9F;
      box-shadow: 0 5px 0 #E07A9F, 0 10px 18px rgba(224, 122, 159, 0.22);
    }
    .btn-pink:hover { transform: translateY(-2px); background: #F8C8DC; }

    .btn-purple, .btn-blue {
      background: linear-gradient(180deg, #D6EAF8 0%, #B8DCF4 100%);
      color: var(--kawaii-brown);
      border: 2px solid #7FB3D5;
      box-shadow: 0 5px 0 #7FB3D5, 0 10px 18px rgba(127, 179, 213, 0.22);
    }
    .btn-purple:hover, .btn-blue:hover { transform: translateY(-2px); }

    .btn-mint {
      background: linear-gradient(180deg, #C8E6C9 0%, #A5D6A7 100%);
      color: var(--kawaii-brown);
      border: 2px solid #66BB6A;
      box-shadow: 0 5px 0 #66BB6A, 0 10px 18px rgba(102, 187, 106, 0.22);
    }
    .btn-mint:hover { transform: translateY(-2px); }

    .btn-peach {
      background: linear-gradient(180deg, #FFF0B3 0%, #FFE082 100%);
      color: var(--kawaii-brown);
      border: 2px solid #D4AC0D;
      box-shadow: 0 5px 0 #D4AC0D, 0 10px 18px rgba(212, 172, 13, 0.2);
    }
    .btn-peach:hover { transform: translateY(-2px); }

    .btn-soft {
      background: var(--kawaii-cream);
      color: var(--kawaii-brown);
      border: 2px solid #F8C8DC;
      box-shadow: 0 4px 0 #F8C8DC;
    }
    .btn-soft:hover { background: var(--kawaii-pink-soft); transform: translateY(-2px); }

    /* Kawaii Pastel Section Surfaces */
    .clay-hero-bg {
      background: linear-gradient(135deg, #FCE4EC 0%, #FFF8E7 50%, #D6EAF8 100%);
    }
    .clay-banner-bg {
      background: linear-gradient(135deg, #FCE4EC 0%, #FFF8E7 55%, #C8E6C9 100%);
    }
    .clay-tint-pink {
      background-color: #FCE4EC;
      border-color: #F8C8DC;
    }
    .clay-tint-mint {
      background-color: #C8E6C9;
      border-color: #81C784;
    }
    .clay-tint-blue {
      background-color: #D6EAF8;
      border-color: #85C1E9;
    }
    .clay-tint-cream {
      background-color: #FFF8E7;
      border-color: #F8C8DC;
    }
    .clay-tint-yellow {
      background-color: #FFF0B3;
      border-color: #F7DC6F;
    }
    .text-plum { color: var(--kawaii-brown); }
    .text-plum-body { color: var(--kawaii-brown); }

    /* Floating & Book Open Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(-1deg); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.55; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    .animate-float-1 { animation: floatSlow 4.2s ease-in-out infinite; }
    .animate-float-2 { animation: floatReverse 4.8s ease-in-out infinite; }
    .animate-float-3 { animation: floatSlow 5.1s ease-in-out infinite 0.5s; }
    .animate-float-4 { animation: floatReverse 4.5s ease-in-out infinite 0.9s; }
    .animate-pop { animation: popIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-twinkle { animation: twinkle 2.4s ease-in-out infinite; }

    /* 3D Interactive Book Flip / Open */
    .book-3d-stage {
      perspective: 1400px;
    }
    .book-3d-card {
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .book-3d-card.is-open {
      transform: rotateY(180deg);
    }
    .book-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .book-back {
      transform: rotateY(180deg);
    }

    /* Confetti Particle */
    .star-burst {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 1.5rem;
      animation: burstFly 1.1s ease-out forwards;
    }
    @keyframes burstFly {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.35) rotate(240deg); }
    }

    /* Custom Scrollbar for Nav */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Print Styles for RPH & Certificate */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
      body {
        background: #FFFFFF !important;
        background-image: none !important;
        color: #000000 !important;
      }
      .no-print { display: none !important; }
      #app-content {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .card-3d {
        box-shadow: none !important;
        border: 1.5px solid #94A3B8 !important;
        border-radius: 10px !important;
        page-break-inside: avoid;
        break-inside: avoid;
        margin-bottom: 12px !important;
      }
      .print-only-clean {
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        width: 100% !important;
      }
      body.printing-certificate-mode #app-content > div > section:not(#certificate-print-section) {
        display: none !important;
      }
      body.printing-certificate-mode #certificate-print-section {
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
      }
      body.printing-certificate-mode #certificate-card-frame {
        border: 6px double #C2527B !important;
        border-radius: 20px !important;
        padding: 36px 28px !important;
        background: #FFF8E7 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        min-height: 170mm;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }

    /* Kawaii Clay 3D Styles Khusus Bahagian Metadata / Profil Pembangun */
    .meta-clay-card {
      background: #FFF4E6;
      border-radius: 2rem;
      border: 3px solid #E9A3BC;
      box-shadow:
        0 10px 0 rgba(233, 163, 188, 0.55),
        0 18px 32px -12px rgba(80, 59, 96, 0.16),
        inset 0 5px 12px rgba(255, 255, 255, 0.92);
      color: #503B60;
    }

    .meta-clay-subcard {
      background: #FFFFFF;
      border-radius: 1.5rem;
      border: 2.5px solid #A8D5BA;
      box-shadow:
        0 6px 0 rgba(168, 213, 186, 0.55),
        0 10px 20px -8px rgba(80, 59, 96, 0.1),
        inset 0 3px 8px rgba(255, 244, 230, 0.85);
      color: #503B60;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .meta-clay-subcard:hover {
      transform: translateY(-3px);
    }

    .meta-clay-pink-box {
      background: linear-gradient(145deg, #FFF4E6 0%, #F9DCE6 100%);
      border-radius: 1.75rem;
      border: 2.5px solid #E9A3BC;
      box-shadow:
        0 7px 0 rgba(233, 163, 188, 0.5),
        inset 0 4px 10px rgba(255, 255, 255, 0.85);
    }

    .meta-clay-mint-box {
      background: linear-gradient(145deg, #FFF4E6 0%, #E3F3E9 100%);
      border-radius: 1.75rem;
      border: 2.5px solid #A8D5BA;
      box-shadow:
        0 7px 0 rgba(168, 213, 186, 0.55),
        inset 0 4px 10px rgba(255, 255, 255, 0.85);
    }

    .meta-avatar-ring {
      border-radius: 9999px;
      background: linear-gradient(145deg, #E9A3BC, #A8D5BA);
      padding: 8px;
      box-shadow:
        0 10px 22px rgba(80, 59, 96, 0.18),
        inset 0 4px 8px rgba(255, 255, 255, 0.85);
    }

    .meta-icon-clay {
      width: 2.85rem;
      height: 2.85rem;
      border-radius: 1rem;
      background: linear-gradient(145deg, #FFF4E6, #F6D5E1);
      border: 2px solid #E9A3BC;
      box-shadow: 0 4px 0 rgba(233, 163, 188, 0.6), inset 0 2px 5px #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="no-print sticky top-0 z-40 bg-[#FFF8E7]/95 backdrop-blur-md border-b-3 border-[#F8C8DC] shadow-xs">

    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function pcmToWav(pcm16, sampleRate) {
      const numChannels = 1;
      const bytesPerSample = 2;
      const blockAlign = numChannels * bytesPerSample;
      const byteRate = sampleRate * blockAlign;
      const dataSize = pcm16.length * bytesPerSample;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcm16.length; i++, offset += 2) {
        view.setInt16(offset, pcm16[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function isStrictlyMalaysianVoice(v) {
      if (!v) return false;
      const lang = (v.lang || '').toLowerCase().replace('_', '-');
      const name = (v.name || '').toLowerCase();
      // Sekat 100% suara Inggeris (en-*) dan Indonesia (id-*)
      if (lang.startsWith('en') || lang.startsWith('id')) return false;
      if (name.includes('english') || name.includes('indonesia') || name.includes('uk ') || name.includes('us ')) return false;
      return lang === 'ms-my' || lang.startsWith('ms') || name.includes('malay') || name.includes('melayu') || name.includes('yasmin') || name.includes('osman');
    }

    function findBestMalaysianVoice(voicesList) {
      const list = voicesList || window.speechSynthesis.getVoices() || [];
      const exactMsMy = list.filter(isStrictlyMalaysianVoice);
      if (exactMsMy.length > 0) {
        return exactMsMy.find(v => (v.name || '').toLowerCase().includes('yasmin'))
            || exactMsMy.find(v => (v.name || '').toLowerCase().includes('osman'))
            || exactMsMy.find(v => (v.lang || '').toLowerCase().replace('_', '-') === 'ms-my')
            || exactMsMy[0];
      }
      return null;
    }

      return String(text || '')

        .replace(/\bwuduk\b/gi, 'wuduk');
    }

    async function fetchMalaysianAiAudioUrl(cleanText) {
      if (ttsAudioCache.has(cleanText)) {
        return ttsAudioCache.get(cleanText);
      }

      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
      const promptText =
        `Bacakan teks berikut dalam Bahasa Melayu Malaysia (loghat standard Malaysia, BUKAN loghat Indonesia dan BUKAN loghat Inggeris) dengan nada guru perempuan Malaysia yang lembut, jelas, mesra dan ceria untuk murid sekolah rendah Tahun 3:\n\n"${cleanText}"`;

      const payload = {
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: "Aoede" }
            }
          }
        },
        model: "gemini-2.5-flash-preview-tts"
      };

      const delays = [800, 1600];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const resp = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const result = await resp.json();
          const part = result?.candidates?.[0]?.content?.parts?.[0];
          const audioData = part?.inlineData?.data;
          const mimeType = part?.inlineData?.mimeType || 'audio/L16;rate=24000';
          if (audioData) {
            const rateMatch = mimeType.match(/rate=(\d+)/);
            const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
            const pcmBuffer = base64ToArrayBuffer(audioData);
            const pcm16 = new Int16Array(pcmBuffer);
            const wavBlob = pcmToWav(pcm16, sampleRate);
            const audioUrl = URL.createObjectURL(wavBlob);
            ttsAudioCache.set(cleanText, audioUrl);
            return audioUrl;
          }
          throw new Error('Tiada data audio');
        } catch (err) {
          if (attempt < delays.length) {
            await new Promise(r => setTimeout(r, delays[attempt]));
          } else {
            return null;
          }
        }
      }
      return null;
    }

    function speakWithStrictMalaysianBrowserVoice(cleanText, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        if (onEndCallback) onEndCallback();
        return;
      }
      const voices = window.speechSynthesis.getVoices() || [];
      let chosen = null;
      if (state.voiceSettings.voiceURI) {
        const manualVoice = voices.find(v => v.voiceURI === state.voiceSettings.voiceURI);
        if (isStrictlyMalaysianVoice(manualVoice)) {
          chosen = manualVoice;
        }
      }
      if (!chosen) {
        chosen = findBestMalaysianVoice(voices);
      }

      // Jangan sekali-kali menggunakan suara English atau Indonesia
      if (!chosen) {
        showToast('🎙️', 'Suara Melayu Malaysia sedang dimuatkan...');
        if (onEndCallback) onEndCallback();
        return;
      }

      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.voice = chosen;
      utter.lang = 'ms-MY';
      utter.rate = state.voiceSettings.rate || 0.92;
      utter.pitch = 1.04;
      utter.onend = () => { if (onEndCallback) onEndCallback(); };
      utter.onerror = () => { if (onEndCallback) onEndCallback(); };
      window.speechSynthesis.speak(utter);
    }

    async function speakMalay(text, onEndCallback = null) {
      stopSpeech();
      const cleanText = normalizeStandardMalayText(text);
      if (!cleanText) {
        if (onEndCallback) onEndCallback();
        return;
      }

      // Jika pengguna memilih suara ms-MY pelayar secara manual, terus gunakan suara ms-MY tersebut
      if (state.voiceSettings.voiceURI) {
        const voices = window.speechSynthesis ? (window.speechSynthesis.getVoices() || []) : [];
        const manualVoice = voices.find(v => v.voiceURI === state.voiceSettings.voiceURI);
        if (isStrictlyMalaysianVoice(manualVoice)) {
          speakWithStrictMalaysianBrowserVoice(cleanText, onEndCallback);
          return;
        }
      }

      // 1. Utama: Jana Suara AI Bahasa Melayu Malaysia semula jadi (bukan English & bukan Indonesia)
      const aiAudioUrl = await fetchMalaysianAiAudioUrl(cleanText);
      if (aiAudioUrl) {
        const audio = new Audio(aiAudioUrl);
        audio.playbackRate = state.voiceSettings.rate || 0.92;
        currentTtsAudio = audio;
        audio.onended = () => {
          if (currentTtsAudio === audio) currentTtsAudio = null;
          if (onEndCallback) onEndCallback();
        };
        audio.onerror = () => {
          if (currentTtsAudio === audio) currentTtsAudio = null;
          speakWithStrictMalaysianBrowserVoice(cleanText, onEndCallback);
        };
        try {
          await audio.play();
          return;
        } catch (playErr) {
          currentTtsAudio = null;
        }
      }

      // 2. Sandaran ketat: Hanya suara pelayar ms-MY Malaysia sahaja
      speakWithStrictMalaysianBrowserVoice(cleanText, onEndCallback);
    }

    }

    function triggerStarBurst(x = window.innerWidth / 2, y = window.innerHeight / 2) {
      const icons = ['⭐', '🌸', '✨', '🌙', '💖'];
      for (let i = 0; i < 12; i++) {
        const el = document.createElement('span');
        el.className = 'star-burst';
        el.textContent = icons[i % icons.length];
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 70 + Math.random() * 80;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        el.style.setProperty('--ty', `${Math.sin(angle) * dist - 30}px`);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1150);
      }
    }

    function playCuteChime(type = 'success') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.setValueAtTime(240, now + 0.14);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

      updateProgressUI();
    }

    function updateProgressUI() {
      const visibleNavItems = state.teacherMode
        ? NAV_ITEMS
        : NAV_ITEMS.filter(item => item.id !== 'rph');
      const total = visibleNavItems.length;
      const visibleIds = new Set(visibleNavItems.map(n => n.id));
      const visitedCount = Math.min(total, [...new Set(state.visitedPages)].filter(id => visibleIds.has(id)).length);
      const pct = Math.round((visitedCount / total) * 100);

      const pctEl = document.getElementById('progress-percent-text');
      const barEl = document.getElementById('global-progress-bar');
      if (pctEl) pctEl.textContent = `${pct}%`;
      if (barEl) barEl.style.width = `${pct}%`;

      const idx = visibleNavItems.findIndex(n => n.id === state.currentPage);
      const stepEl = document.getElementById('footer-step-indicator');
      if (stepEl && idx >= 0) {
        stepEl.textContent = `${state.teacherMode ? '👩‍🏫 Mod Guru' : '🎒 Mod Pelajar'} • Bahagian ${idx + 1} daripada ${total} (${visibleNavItems[idx].short})`;
      }

      const prevBtn = document.getElementById('btn-prev-page');
      const nextBtn = document.getElementById('btn-next-page');
      if (prevBtn) prevBtn.disabled = idx <= 0;
      if (nextBtn) nextBtn.disabled = idx >= total - 1;
    }

    function navigateTo(pageId) {
      stopSpeech();
      if (pageId !== 'set-induksi') stopInduksi3DAnimation();
      if (pageId !== 'penilaian') stopGameshowTimer();

      state.currentPage = pageId;
      if (!state.visitedPages.includes(pageId)) {
        state.visitedPages.push(pageId);
      }
      saveState();
      renderNavigation();
      renderPage(pageId);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goPrevPage() {
      const visibleNavItems = state.teacherMode
        ? NAV_ITEMS
        : NAV_ITEMS.filter(item => item.id !== 'rph');
      const idx = visibleNavItems.findIndex(n => n.id === state.currentPage);
      if (idx > 0) navigateTo(visibleNavItems[idx - 1].id);
    }

    function goNextPage() {
      const visibleNavItems = state.teacherMode
        ? NAV_ITEMS
        : NAV_ITEMS.filter(item => item.id !== 'rph');
      const idx = visibleNavItems.findIndex(n => n.id === state.currentPage);
      if (idx >= 0 && idx < visibleNavItems.length - 1) {
        navigateTo(visibleNavItems[idx + 1].id);
      }
    }

    function renderPage(pageId) {
      const container = document.getElementById('app-content');
      if (!container) return;

      switch (pageId) {
        case 'home':
          container.innerHTML = renderHomePage();
          break;
        case 'dskp':
          container.innerHTML = renderDskpPage();
          break;
        case 'rph':
          container.innerHTML = renderRphPage();
          break;
        case 'chatbot':
          container.innerHTML = renderChatbotPage();
          scrollChatToBottom();
          break;
        case 'set-induksi':
          container.innerHTML = renderSetInduksiPage();
          break;
        case 'langkah-1':
          container.innerHTML = renderLangkah1Page();
          break;
        case 'langkah-2':
          container.innerHTML = renderLangkah2Page();
          break;
        case 'langkah-3':
          container.innerHTML = renderLangkah3Page();
          break;
        case 'penilaian':
          container.innerHTML = renderPenilaianPage();
          break;
        case 'permainan':
          container.innerHTML = renderPermainanPage();
          break;
        case 'penutup':
          container.innerHTML = renderPenutupPage();
          break;
        case 'metadata':
          container.innerHTML = renderMetadataPage();
          setTimeout(() => renderFeedbackQrCanvas(), 40);
          break;
        default:
          container.innerHTML = renderHomePage();
      }
    }

    function handleRphFileUpload(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const sizeKb = Math.max(1, Math.round(file.size / 1024)) + ' KB';
      const reader = new FileReader();
      reader.onload = function(e) {
        state.uploadedRph = {
          fileName: file.name,
          fileType: file.type,
          fileSize: sizeKb,
          dataUrl: file.size <= 2 * 1024 * 1024 ? e.target.result : '',
          uploadedAt: new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })
        };
        saveState();
        renderPage('rph');
        showToast('📎', 'Fail RPH berjaya dilampirkan!');
      };
      reader.readAsDataURL(file);
    }

    function getCurriculumFallbackAnswer(question) {
      const q = question.toLowerCase();
      if (q.includes('taurat') || q.includes('musa')) {
        return 'Kitab Taurat diturunkan oleh Allah SWT kepada Nabi Musa AS dalam bahasa Ibrani sebagai panduan hidup bagi kaum Bani Israel. 📖';
      }
      if (q.includes('zabur') || q.includes('daud')) {
        return 'Kitab Zabur diturunkan oleh Allah SWT kepada Nabi Daud AS dan mengandungi zikir, doa serta puji-pujian kepada Allah SWT. 🌟';
      }
      if (q.includes('injil') || q.includes('isa')) {
        return 'Kitab Injil diturunkan oleh Allah SWT kepada Nabi Isa AS dalam bahasa Suryani untuk membimbing kaum Bani Israel. ✨';
      }
      if (q.includes('quran') || q.includes('muhammad') || q.includes('istimewa')) {
        return 'Kitab Al-Quran ialah kalam Allah yang terakhir diturunkan kepada Nabi Muhammad SAW dalam bahasa Arab untuk seluruh umat manusia dan keasliannya terpelihara hingga hari kiamat! 🕌';
      }
      if (q.includes('adab')) {
        return 'Antara adab terhadap Al-Quran ialah berwuduk sebelum menyentuhnya, membaca dengan bertajwid, menutup aurat dan meletakkan Al-Quran di tempat yang tinggi serta mulia. 💖';
      }
      if (q.includes('4') || q.includes('empat') || q.includes('senarai') || q.includes('nabi')) {
        return 'Terdapat 4 buah kitab Allah yang wajib kita ketahui: 1) Kitab Taurat (Nabi Musa AS), 2) Kitab Zabur (Nabi Daud AS), 3) Kitab Injil (Nabi Isa AS), dan 4) Kitab Al-Quran (Nabi Muhammad SAW). 📚';
      }
      return 'Beriman kepada kitab Allah ialah Rukun Iman yang ke-3. Kita wajib yakin bahawa Allah SWT telah menurunkan 4 kitab suci (Taurat, Zabur, Injil dan Al-Quran) kepada para rasul sebagai panduan hidup manusia! 🌸';
    }

    async function processChatbotQuestion(userQuestion) {
      if (isChatbotLoading) return;
      chatHistory.push({ sender: 'user', text: userQuestion });
      isChatbotLoading = true;
      renderPage('chatbot');
      scrollChatToBottom();

      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      const systemInstruction = 'Anda ialah guru pembantu Pendidikan Islam Tahun 3 yang mesra, lembut dan ceria bernama Rakan AI KITABQUEST. Jawab dalam Bahasa Melayu Malaysia yang mudah difahami murid berumur 9 tahun (2-4 ayat sahaja) berdasarkan DSKP Pendidikan Islam Tahun 3 tajuk Beriman kepada Kitab Allah (Taurat - Nabi Musa AS, Zabur - Nabi Daud AS, Injil - Nabi Isa AS, Al-Quran - Nabi Muhammad SAW).';

      let botReply = null;
      const delays = [800, 1600];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const resp = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: systemInstruction }] },
              contents: [{ parts: [{ text: userQuestion }] }]
            })
          });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          const candidateText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (candidateText) {
            botReply = candidateText.trim();
            break;
          }
          throw new Error('Tiada respons teks');
        } catch (err) {
          if (attempt < delays.length) {
            await new Promise(r => setTimeout(r, delays[attempt]));
          }
        }
      }

      if (!botReply) {
        botReply = getCurriculumFallbackAnswer(userQuestion);
      }

      isChatbotLoading = false;
      chatHistory.push({ sender: 'bot', text: botReply });
      renderPage('chatbot');
      scrollChatToBottom();
    }

      matchingState.selectedKitab = null;
      matchingState.checked = false;
      playCuteChime('success');
      renderPage('langkah-3');

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              ${ASSESSMENT_QUESTIONS[gameshowState.currentIdx].options.map((opt, oIdx) => {
                const qObj = ASSESSMENT_QUESTIONS[gameshowState.currentIdx];
                let btnClass = 'bg-white border-[#F8C8DC] hover:bg-[#FCE4EC]/50';
                if (gameshowState.answered) {
                  if (oIdx === qObj.correct) btnClass = 'bg-[#C8E6C9] border-[#66BB6A]';
                  else if (oIdx === gameshowState.selectedOption) btnClass = 'bg-[#FCE4EC] border-[#E07A9F]';
                }
                return `
                <button
                  onclick="submitAssessmentAnswer(${oIdx})"
                  ${gameshowState.answered ? 'disabled' : ''}
                  class="p-4 rounded-2xl border-3 text-left font-bold text-sm sm:text-base transition-all ${btnClass}"
                >
                  <span class="inline-block w-7 h-7 rounded-full bg-[#FFF0B3] text-center leading-7 text-xs font-extrabold mr-2">${String.fromCharCode(65 + oIdx)}</span>
                  ${opt}
                </button>
                `;
              }).join('')}
            </div>

            ${gameshowState.answered ? `
              <div class="p-4 rounded-2xl ${gameshowState.selectedOption === ASSESSMENT_QUESTIONS[gameshowState.currentIdx].correct ? 'bg-[#C8E6C9]/70 border-2 border-[#66BB6A]' : 'bg-[#FFF0B3] border-2 border-[#D4AC0D]'} space-y-2">
                <div class="font-display font-bold text-base">
                  ${gameshowState.selectedOption === ASSESSMENT_QUESTIONS[gameshowState.currentIdx].correct ? '🌟 Syabas! Jawapan Betul!' : '💡 Hampir Tepat! Mari Semak:'}
                </div>
                <p class="text-sm font-semibold">${ASSESSMENT_QUESTIONS[gameshowState.currentIdx].explain}</p>
                <div class="pt-1 text-right">
                  <button onclick="nextAssessmentQuestion()" class="btn-3d btn-pink px-5 py-2.5 text-sm">
                    ${gameshowState.currentIdx + 1 < totalQ ? 'Soalan Seterusnya ➡️' : 'Lihat Keputusan 🏆'}
                  </button>
                </div>
              </div>
            ` : ''}
          </section>
        ` : ''}
      </div>
      `;

    function submitAssessmentAnswer(optIdx) {
      if (gameshowState.answered) return;
      gameshowState.selectedOption = optIdx;
      gameshowState.answered = true;
      const isCorrect = optIdx === ASSESSMENT_QUESTIONS[gameshowState.currentIdx].correct;
      if (isCorrect) {
        gameshowState.score++;
        gameshowState.streak++;
        playCuteChime('success');
        triggerStarBurst();
      } else {
        gameshowState.streak = 0;
        playCuteChime('wrong');
      }
      renderPage('penilaian');
    }

    function nextAssessmentQuestion() {
      if (gameshowState.currentIdx + 1 < ASSESSMENT_QUESTIONS.length) {
        gameshowState.currentIdx++;
        gameshowState.selectedOption = null;
        gameshowState.answered = false;
      } else {
        gameshowState.finished = true;
        state.quizScore = gameshowState.score;
        saveState();
      }
      renderPage('penilaian');
    }

    function restartAssessmentQuiz() {
      gameshowState = { currentIdx: 0, selectedOption: null, answered: false, score: 0, streak: 0, finished: false };
      renderPage('penilaian');
    }

    function speakAssessmentQuestion(idx) {
      const qObj = ASSESSMENT_QUESTIONS[idx];

      ctx.strokeStyle = '#81C784';
      ctx.lineWidth = 3;
      ctx.strokeRect(220, 620, 760, 64);

      ctx.fillStyle = '#594A4E';
      ctx.font = 'bold 21px sans-serif';
      ctx.fillText(`⭐ Skor Padanan: ${state.matchingScore}/4   •   🏆 Skor Kuiz: ${quizText}   •   📅 Tarikh: ${todayStr}`, 600, 660);

      const link = document.createElement('a');
      link.download = `Sijil-KITABQUEST-${studentDisplay.replace(/\s+/g, '-')}.png`;
      link.href = canvas.toDataURL('image/png');

    function isValidHttpImageUrl(urlStr) {
      if (!urlStr) return false;
      try {
        const parsed = new URL(urlStr.trim());
        return parsed.protocol === 'http:' || parsed.protocol === 'https:';
      } catch (e) {
        return false;
      }
    }

    function previewDeveloperPhotoUrl() {
      const input = document.getElementById('input-dev-photo-url');
      if (!input) return;
      const val = input.value.trim();

      if (!val) {
        metaPhotoPreviewDraft = '';
        metaPhotoLoadError = false;
        renderPage('metadata');
        showToast('🖼️', 'Memaparkan gambar placeholder sementara.');
        return;
      }

      if (!isValidHttpImageUrl(val)) {
        metaPhotoLoadError = true;
        renderPage('metadata');
        showToast('⚠️', 'Pautan gambar tidak sah. Sila masukkan URL bermula dengan https://');
        return;
      }

      metaPhotoLoadError = false;
      metaPhotoPreviewDraft = val;
      renderPage('metadata');
      showToast('👁️', 'Pratonton gambar profil dikemas kini.');
    }

    function saveDeveloperPhotoUrl() {
      const input = document.getElementById('input-dev-photo-url');
      if (!input) return;
      const val = input.value.trim();

      if (val && !isValidHttpImageUrl(val)) {
        metaPhotoLoadError = true;
        renderPage('metadata');
        showToast('⚠️', 'Gagal menyimpan: pautan gambar tidak sah.');
        return;
      }

      metaPhotoLoadError = false;
      metaPhotoPreviewDraft = null;
      state.metadata.photoUrl = val;
      saveState();
      renderPage('metadata');
      showToast('💾', 'Pautan gambar profil berjaya disimpan!');
    }

    function handleDeveloperPhotoError() {
      metaPhotoLoadError = true;
      const imgEl = document.getElementById('developer-profile-img');
      if (imgEl) {
        imgEl.onerror = null;
        imgEl.src = getDefaultProfilePlaceholderSvg();
      }
      showToast('⚠️', 'Gambar gagal dimuatkan daripada pautan URL tersebut.');
    }

    function copyDeployConfigSnippet() {
      const m = state.metadata || {};
      const esc = (s) => String(s || '').split('\\').join('\\\\').split("'").join("\\'");
      const snippet = [
        'const DEVELOPER_PROFILE_CONFIG = {',
        "  photoUrl: '" + esc(m.photoUrl || '') + "',",
        "  fullName: '" + esc(m.fullName && !m.fullName.startsWith('[') ? m.fullName : DEVELOPER_PROFILE_CONFIG.fullName) + "',",
        "  program: '" + esc(m.program && !m.program.startsWith('[') ? m.program : DEVELOPER_PROFILE_CONFIG.program) + "',",
        "  institution: '" + esc(m.institution && !m.institution.startsWith('[') ? m.institution : DEVELOPER_PROFILE_CONFIG.institution) + "',",
        "  role: 'Pereka dan Pembangun Bahan Pembelajaran Digital',",
        "  version: '" + esc(m.version || DEVELOPER_PROFILE_CONFIG.version) + "',",
        "  updatedDate: '" + esc(m.updatedDate || DEVELOPER_PROFILE_CONFIG.updatedDate) + "'",
        '};'
      ].join('\n');

      const tempArea = document.createElement('textarea');
      tempArea.value = snippet;
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        showToast('📋', 'Kod konfigurasi kekal disalin! Tampal pada DEVELOPER_PROFILE_CONFIG dalam kod sebelum publish.');
      } catch (e) {
        showToast('⚠️', 'Tidak dapat menyalin secara automatik.');
      }
      document.body.removeChild(tempArea);
    }

    function uploadQrImage(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        state.metadata.qrImageData = e.target.result;
        saveState();
        renderPage('metadata');
        showToast('📱', 'Imej Kod QR maklum balas berjaya dimuat naik!');
      };
      reader.readAsDataURL(file);
    }

    function clearQrImage() {
      state.metadata.qrImageData = '';
      saveState();
      renderPage('metadata');
    }

    function renderFeedbackQrCanvas() {

      const qrTargetUrl = DEVELOPER_PROFILE_CONFIG.feedbackQrUrl || 'https://docs.google.com/forms/d/e/1FAIpQLSdyXpw0zOxUh7-kPFyv1PloFAVTbX8SWHTMU3wAYjwVPDnf3w/viewform?usp=header';
      container.innerHTML = '';

      if (typeof QRCode !== 'undefined') {
        try {
          new QRCode(container, {
            text: qrTargetUrl,
            width: 176,
            height: 176,
            colorDark: '#1A1A1A',
            colorLight: '#FFFFFF',
            correctLevel: QRCode.CorrectLevel.M
          });
          const qrImg = container.querySelector('img');
          if (qrImg) {
            qrImg.style.width = '100%';
            qrImg.style.height = '100%';
